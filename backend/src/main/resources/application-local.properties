# Local-only profile: embedded file-based H2 database.
# Bind address: loopback by default; override with SERVER_ADDRESS (e.g. 0.0.0.0)
# when you need to reach the API from a phone/another machine.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Local automated/manual testing repeatedly logs in; keep production rate limits off here.
app.login-rate-limit.enabled=${APP_LOGIN_RATE_LIMIT_ENABLED:false}
# Data file (relative to the backend working directory):
#   backend/data/diagram_editor.mv.db
# Delete backend/data while the backend is stopped to reset the local database.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=${DIAGRAM_DB_URL:jdbc:h2:file:./data/diagram_editor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DIAGRAM_DB_USERNAME:sa}
spring.datasource.password=${DIAGRAM_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-h2.sql

# Browse http://localhost:8080/h2-console while the backend is running.
# JDBC URL: jdbc:h2:file:./data/diagram_editor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Demo account for this machine only. Override with APP_DEFAULT_USER_* if needed.
app.default-user.enabled=true
app.default-user.username=${APP_DEFAULT_USER_USERNAME:demo}
app.default-user.user-id=${APP_DEFAULT_USER_USER_ID:demo-user}
app.default-user.display-name=${APP_DEFAULT_USER_DISPLAY_NAME:Local Demo User}
app.default-user.password=${APP_DEFAULT_USER_PASSWORD:demo123}
app.default-user.recovery-code=${APP_DEFAULT_USER_RECOVERY_CODE:RECOVER-2026}
