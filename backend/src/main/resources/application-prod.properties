# Online/production profile: MySQL 8, matching the original project setup.
# Activate with:
#   SPRING_PROFILES_ACTIVE=prod
#   DIAGRAM_DB_URL / DIAGRAM_DB_USERNAME / DIAGRAM_DB_PASSWORD

# Bind address: 0.0.0.0 by default (containers / separate hosts).
# Behind an Nginx on the same machine, narrow it with SERVER_ADDRESS=127.0.0.1.
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DIAGRAM_DB_URL:jdbc:mysql://localhost:3306/diagram_editor?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DIAGRAM_DB_USERNAME:root}
spring.datasource.password=${DIAGRAM_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none

# Do not create demo users in production. Seed the first real account explicitly
# (SQL/03-default-user.sql or APP_DEFAULT_USER_* once, then disable this again).
app.default-user.enabled=${APP_DEFAULT_USER_ENABLED:false}
app.default-user.username=${APP_DEFAULT_USER_USERNAME:}
app.default-user.user-id=${APP_DEFAULT_USER_USER_ID:}
app.default-user.display-name=${APP_DEFAULT_USER_DISPLAY_NAME:}
app.default-user.password=${APP_DEFAULT_USER_PASSWORD:}
app.default-user.recovery-code=${APP_DEFAULT_USER_RECOVERY_CODE:}

# Comma-separated browser origins. Leave empty when the frontend is served
# from the same origin behind a reverse proxy.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.proxy.trust-forwarded-headers=${APP_TRUST_FORWARDED_HEADERS:true}
