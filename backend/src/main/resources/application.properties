# Shared settings for every environment.
# Local development is the default profile (H2, no external database needed).
# Production/online startup must explicitly select the "prod" profile:
#   SPRING_PROFILES_ACTIVE=prod
server.port=${SERVER_PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.encoding=UTF-8
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.pattern.level=%5p [%X{requestId:-}]

# Change this value in every online environment.
app.auth.token-secret=${APP_AUTH_TOKEN_SECRET:diagram-editor-local-token-secret-2026}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.proxy.trust-forwarded-headers=${APP_TRUST_FORWARDED_HEADERS:false}

# Optional bootstrap account. Disabled unless a profile explicitly enables it.
app.default-user.enabled=${APP_DEFAULT_USER_ENABLED:false}
app.default-user.username=${APP_DEFAULT_USER_USERNAME:}
app.default-user.user-id=${APP_DEFAULT_USER_USER_ID:}
app.default-user.display-name=${APP_DEFAULT_USER_DISPLAY_NAME:}
app.default-user.password=${APP_DEFAULT_USER_PASSWORD:}
app.default-user.recovery-code=${APP_DEFAULT_USER_RECOVERY_CODE:}
