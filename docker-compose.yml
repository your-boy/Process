version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: process-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: process_db
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 10s
      retries: 10

  backend:
    build: ./backend
    container_name: process-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/process_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ProcessSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm
      FRONTEND_URL: http://localhost:5173
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-email-password}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: process-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
