<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>E · Liquid Glass（Apple 2025 系）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --fg:#ffffff;
    --fg-72:rgba(255,255,255,.72);
    --fg-55:rgba(255,255,255,.55);
    --fg-40:rgba(255,255,255,.40);
    --glass:rgba(255,255,255,.10);
    --stroke:rgba(255,255,255,.24);
    --r:22px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  }
  html,body{height:100%}
  body{font-family:var(--sans);font-size:13.5px;line-height:1.55;color:var(--fg);
       -webkit-font-smoothing:antialiased;letter-spacing:.002em;overflow:hidden;
       background:
         radial-gradient(1100px 700px at 8% 4%, #4b3fa8 0%, rgba(75,63,168,0) 55%),
         radial-gradient(900px 640px at 92% 12%, #a63a72 0%, rgba(166,58,114,0) 52%),
         radial-gradient(1000px 760px at 74% 96%, #c56a3c 0%, rgba(197,106,60,0) 55%),
         radial-gradient(900px 700px at 14% 92%, #12656e 0%, rgba(18,101,110,0) 55%),
         linear-gradient(160deg,#0b0d1c 0%,#14122a 45%,#1a1226 100%);
       background-attachment:fixed}
  .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none;z-index:0}
  .b1{width:520px;height:520px;left:-120px;top:-140px;background:#5b4bff}
  .b2{width:460px;height:460px;right:-100px;top:60px;background:#ff5fa2;opacity:.38}
  .b3{width:560px;height:560px;right:8%;bottom:-220px;background:#ff8a3d;opacity:.34}
  .noise{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.16;
         background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.5'/></svg>")}

  .app{position:relative;z-index:1;height:100vh;padding:14px;display:grid;
       grid-template-columns:224px 1fr;gap:12px}
  .glass{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
         backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.34), inset 0 -1px 0 rgba(255,255,255,.06),
                    0 24px 60px -24px rgba(0,0,0,.65)}

  .rail{display:flex;flex-direction:column;min-height:0;padding:14px 10px}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px}
  .mark{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-weight:600;font-size:12px;
        background:linear-gradient(150deg,rgba(255,255,255,.92),rgba(255,255,255,.55));color:#221a3d;
        box-shadow:inset 0 1px 0 #fff, 0 4px 12px rgba(0,0,0,.25)}
  .brand b{font-size:14px;font-weight:600;letter-spacing:.01em}
  .brand .t{margin-left:auto;font-size:10px;color:var(--fg-55);border:1px solid var(--stroke);
            border-radius:999px;padding:1px 7px}

  .nav{display:flex;flex-direction:column;gap:2px;padding:0 2px}
  .nv{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:10px;
      color:var(--fg-72);font-size:13px;cursor:pointer;border:1px solid transparent}
  .nv:hover{background:rgba(255,255,255,.10);color:#fff}
  .nv.on{background:rgba(255,255,255,.18);border-color:var(--stroke);color:#fff;font-weight:500;
         box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .nv .i{width:14px;height:14px;opacity:.8;display:grid;place-items:center;font-size:11px}

  .lbl{padding:16px 12px 7px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-40)}
  .files{overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:1px;padding:0 2px}
  .fl{padding:7px 10px;border-radius:10px;cursor:pointer}
  .fl:hover{background:rgba(255,255,255,.08)}
  .fl.on{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  .fl .t{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fl .m{font-size:10.5px;color:var(--fg-55);margin-top:1px}

  .me{display:flex;align-items:center;gap:9px;padding:10px 8px 2px;margin-top:8px;border-top:1px solid rgba(255,255,255,.12)}
  .av{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.20);border:1px solid var(--stroke);
      display:grid;place-items:center;font-size:10.5px}
  .me .n{font-size:12.5px}
  .me .s{font-size:10.5px;color:var(--fg-55);line-height:1.2}

  .main{display:flex;flex-direction:column;min-width:0;min-height:0;gap:12px}
  .topbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:18px}
  .bc{font-size:13px;color:var(--fg-55)}
  .bc b{color:#fff;font-weight:500}
  .tr{margin-left:auto;display:flex;align-items:center;gap:8px}
  .btn{height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--stroke);
       background:rgba(255,255,255,.10);color:#fff;font:inherit;font-size:12.5px;cursor:pointer;
       display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(10px);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:.15s}
  .btn:hover{background:rgba(255,255,255,.20)}
  .btn.pri{background:linear-gradient(150deg,rgba(255,255,255,.95),rgba(255,255,255,.72));
           color:#1c1730;border-color:rgba(255,255,255,.7);font-weight:600;
           box-shadow:inset 0 1px 0 #fff,0 8px 24px -8px rgba(255,255,255,.5)}
  .btn.pri:hover{filter:brightness(1.04)}
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}

  .body{flex:1;display:flex;flex-direction:column;min-height:0;border-radius:26px;overflow:hidden}
  .head{flex:none;padding:18px 20px 0}
  .head .r{display:flex;align-items:center;gap:10px}
  .ti{flex:1;min-width:0;font-size:19px;font-weight:600;letter-spacing:-.012em;border:0;background:transparent;
      color:#fff;font-family:inherit;outline:none;padding:2px 0}
  .chip{height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--stroke);background:rgba(255,255,255,.10);
        font-size:10.5px;color:var(--fg-72);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .chip.ok{color:#b8ffd9;border-color:rgba(120,255,190,.35);background:rgba(60,220,150,.14)}

  .tabs{display:inline-flex;gap:2px;margin-top:14px;padding:3px;border-radius:12px;
        background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
  .tb{height:26px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--fg-55);
      font:inherit;font-size:12.5px;cursor:pointer}
  .tb:hover{color:#fff}
  .tb.on{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

  .work{flex:1;display:grid;grid-template-columns:1fr 250px;gap:12px;min-height:0;padding:14px 16px 16px}
  .canvas{position:relative;border-radius:18px;overflow:hidden;
          background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
          border:1px solid rgba(255,255,255,.16);
          box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
  .canvas::before{content:"";position:absolute;inset:0;
     background-image:radial-gradient(rgba(255,255,255,.13) 1px, transparent 1px);background-size:24px 24px}
  .hud{position:absolute;left:12px;top:12px;display:flex;gap:6px}
  .hc{height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
      display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-72);backdrop-filter:blur(10px)}
  .hc b{color:#fff;font-weight:500}
  .zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;border-radius:999px;
        background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);overflow:hidden}
  .zoom button{width:26px;height:26px;border:0;background:transparent;color:var(--fg-72);cursor:pointer;font-size:14px}
  .zoom button:hover{background:rgba(255,255,255,.14);color:#fff}
  .zoom .l{height:26px;padding:0 8px;display:grid;place-items:center;font-size:11px;color:var(--fg-72);
           border-left:1px solid rgba(255,255,255,.14);border-right:1px solid rgba(255,255,255,.14)}
  svg.flow{position:absolute;inset:0;width:100%;height:100%}
  svg.flow path[marker-end]{fill:none}

  .insp{border-radius:18px;padding:12px;display:flex;flex-direction:column;min-height:0;overflow:auto;
        background:linear-gradient(165deg,rgba(255,255,255,.12),rgba(255,255,255,.05));
        border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
  .isec{padding:10px 4px 14px}
  .isec + .isec{border-top:1px solid rgba(255,255,255,.12)}
  .isec h4{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-40);
           font-weight:500;margin:4px 0 10px;display:flex}
  .isec h4 span{margin-left:auto;letter-spacing:0;color:var(--fg-40)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .tile{aspect-ratio:1/.9;border-radius:12px;display:grid;place-items:center;cursor:grab;
        background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:.16s}
  .tile:hover{background:rgba(255,255,255,.16)}
  .tile.on{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.5);
           box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px -6px rgba(255,255,255,.45)}
  .tile svg{width:25px;height:25px;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.4}
  .sws{display:flex;gap:7px;flex-wrap:wrap}
  .sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:1px solid rgba(255,255,255,.35);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .sw.on{box-shadow:0 0 0 2px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.6)}
  .kv{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;color:var(--fg-55)}
  .kv b{color:#fff;font-weight:500;font-variant-numeric:tabular-nums}
  .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.14);margin:10px 0 12px;position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;width:38%;border-radius:2px;background:rgba(255,255,255,.85)}
  .bar b{position:absolute;left:38%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
         background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="noise"></div>

<div class="app">
  <aside class="rail glass">
    <div class="brand">
      <div class="mark">P</div>
      <b>Process</b>
      <span class="t">LOCAL</span>
    </div>

    <nav class="nav">
      <div class="nv on"><span class="i">▤</span>全部文件</div>
      <div class="nv"><span class="i">◇</span>模板</div>
      <div class="nv"><span class="i">✕</span>回收站</div>
    </nav>

    <div class="lbl">最近</div>
    <div class="files">
      <div class="fl on"><div class="t">未命名流程图</div><div class="m">刚刚 · 草稿</div></div>
      <div class="fl"><div class="t">支付链路梳理</div><div class="m">2 小时前</div></div>
      <div class="fl"><div class="t">Q3 规划脑图</div><div class="m">昨天</div></div>
      <div class="fl"><div class="t">接口设计说明</div><div class="m">3 天前</div></div>
    </div>

    <div class="me">
      <div class="av">L</div>
      <div><div class="n">Local Demo</div><div class="s">本地工作区</div></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar glass">
      <div class="bc">文件 <span style="opacity:.5">/</span> <b>未命名流程图</b></div>
      <div class="tr">
        <button class="btn"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 12l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>导出</button>
        <button class="btn">分享</button>
        <button class="btn pri">保存</button>
      </div>
    </div>

    <div class="body glass">
      <div class="head">
        <div class="r">
          <input class="ti" value="未命名流程图" />
          <span class="chip ok">● 已同步</span>
          <span class="chip">流程图</span>
        </div>
        <div class="tabs">
          <button class="tb on">流程图</button>
          <button class="tb">思维导图</button>
          <button class="tb">Markdown</button>
          <button class="tb">思维笔记</button>
        </div>
      </div>

      <div class="work">
        <div class="canvas">
          <div class="hud">
            <div class="hc">节点 <b>5</b></div>
            <div class="hc">连线 <b>4</b></div>
          </div>

          <svg class="flow" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet">
            <defs>
              <marker id="e-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M0,0.5 L9,5 L0,9.5 z" fill="rgba(255,255,255,.55)"/>
              </marker>
              <marker id="e-arrow-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M0,0.5 L9,5 L0,9.5 z" fill="#ffffff"/>
              </marker>
              <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="5" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <path d="M180 238 H248" stroke="rgba(255,255,255,.45)" stroke-width="1.5" marker-end="url(#e-arrow)"/>
            <path d="M392 238 H462" stroke="#ffffff" stroke-width="1.8" marker-end="url(#e-arrow-on)" filter="url(#glow)" opacity=".95"/>
            <path d="M540 238 H560 Q572 238 572 226 V160 Q572 148 584 148 H618" stroke="rgba(255,255,255,.45)" stroke-width="1.5" marker-end="url(#e-arrow)"/>
            <path d="M540 238 H560 Q572 238 572 250 V316 Q572 328 584 328 H618" stroke="rgba(255,255,255,.45)" stroke-width="1.5" marker-end="url(#e-arrow)"/>

            <g>
              <rect x="60" y="210" width="120" height="56" rx="16" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.32)"/>
              <rect x="60" y="210" width="120" height="28" rx="16" fill="rgba(255,255,255,.10)" opacity=".6"/>
              <text x="120" y="243" text-anchor="middle" fill="#fff" font-size="13" font-family="-apple-system,'PingFang SC',sans-serif">开始</text>
            </g>
            <g>
              <rect x="248" y="210" width="144" height="56" rx="16" fill="rgba(255,255,255,.26)" stroke="rgba(255,255,255,.6)"/>
              <rect x="248" y="210" width="144" height="28" rx="16" fill="rgba(255,255,255,.16)" opacity=".7"/>
              <text x="320" y="243" text-anchor="middle" fill="#fff" font-size="13" font-weight="500" font-family="-apple-system,'PingFang SC',sans-serif">需求评审</text>
            </g>
            <g>
              <path d="M462 238 L540 200 L618 238 L540 276 Z" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.32)" stroke-linejoin="round"/>
              <text x="540" y="243" text-anchor="middle" fill="#ffffff" font-size="12" font-family="-apple-system,'PingFang SC',sans-serif">通过？</text>
            </g>
            <g>
              <rect x="618" y="120" width="140" height="56" rx="16" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.32)"/>
              <rect x="618" y="120" width="140" height="28" rx="16" fill="rgba(255,255,255,.10)" opacity=".6"/>
              <text x="688" y="153" text-anchor="middle" fill="#fff" font-size="13" font-family="-apple-system,'PingFang SC',sans-serif">开发实现</text>
            </g>
            <g>
              <rect x="618" y="300" width="140" height="56" rx="16" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.32)"/>
              <rect x="618" y="300" width="140" height="28" rx="16" fill="rgba(255,255,255,.10)" opacity=".6"/>
              <text x="688" y="333" text-anchor="middle" fill="#fff" font-size="13" font-family="-apple-system,'PingFang SC',sans-serif">退回修改</text>
            </g>
          </svg>

          <div class="zoom"><button>−</button><div class="l">100%</div><button>+</button></div>
        </div>

        <aside class="insp">
          <div class="isec">
            <h4>图形 <span>06</span></h4>
            <div class="tiles">
              <div class="tile on"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="3"/></svg></div>
              <div class="tile"><svg viewBox="0 0 24 24"><path d="M12 4l8 8-8 8-8-8z"/></svg></div>
              <div class="tile"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="5.5"/></svg></div>
              <div class="tile"><svg viewBox="0 0 24 24"><path d="M4 12h5l3-5 3 10 3-5h2"/></svg></div>
              <div class="tile"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></div>
              <div class="tile"><svg viewBox="0 0 24 24"><path d="M4 8h10a3 3 0 010 6H9l-5 5z"/></svg></div>
            </div>
          </div>

          <div class="isec">
            <h4>外观</h4>
            <div class="sws">
              <div class="sw on" style="background:rgba(255,255,255,.26)"></div>
              <div class="sw" style="background:rgba(255,255,255,.14)"></div>
              <div class="sw" style="background:rgba(160,140,255,.55)"></div>
              <div class="sw" style="background:rgba(255,140,190,.5)"></div>
              <div class="sw" style="background:rgba(120,230,190,.5)"></div>
            </div>
            <div class="bar"><i></i><b></b></div>
            <div class="kv"><span>描边</span><b>1.5 px</b></div>
            <div class="kv"><span>圆角</span><b>16 px</b></div>
            <div class="kv"><span>模糊</span><b>26 px</b></div>
          </div>

          <div class="isec" style="border-top:0">
            <h4>布局</h4>
            <div class="kv"><span>吸附网格</span><b>24 px</b></div>
            <div class="kv"><span>节点</span><b>5</b></div>
          </div>
        </aside>
      </div>
    </div>
  </div>
</div>
</body>
</html>
