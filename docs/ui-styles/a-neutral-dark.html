<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>A · 中性工作台（Linear / Vercel 系）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0b0d; --panel:#101113; --panel-2:#15161a; --panel-3:#1a1c21;
    --line:#1e2024; --line-2:#2a2d34;
    --fg:#e8e9ed; --fg-dim:#9aa0ab; --fg-faint:#666c78;
    --accent:#6e7bf2; --accent-soft:rgba(110,123,242,.14);
    --radius:6px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  }
  html,body{height:100%}
  body{font-family:var(--sans);font-size:13px;line-height:1.5;background:var(--bg);color:var(--fg);
       -webkit-font-smoothing:antialiased;letter-spacing:-.006em}
  .app{display:grid;grid-template-columns:222px 1fr;height:100vh;overflow:hidden}

  .rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:9px;padding:14px 14px 12px}
  .mark{width:20px;height:20px;border-radius:5px;background:var(--fg);color:#0a0b0d;display:grid;place-items:center;
        font-size:11px;font-weight:700;letter-spacing:0}
  .brand b{font-size:13px;font-weight:600;letter-spacing:-.01em}
  .brand span{font-size:10.5px;color:var(--fg-faint);font-family:var(--mono);margin-left:auto}

  .nav{padding:6px 8px}
  .nav-item{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--radius);
            color:var(--fg-dim);font-size:12.5px;cursor:pointer}
  .nav-item:hover{background:var(--panel-2);color:var(--fg)}
  .nav-item.is-active{background:var(--panel-3);color:var(--fg)}
  .nav-item .ico{width:14px;height:14px;opacity:.75;display:grid;place-items:center;font-size:11px}
  .nav-item .kbd{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--fg-faint)}

  .rail-sec{padding:14px 16px 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint)}
  .doclist{padding:0 8px;overflow:auto;min-height:0;flex:1}
  .doc{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:var(--radius);cursor:pointer}
  .doc:hover{background:var(--panel-2)}
  .doc.is-active{background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--line-2)}
  .doc .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
  .doc .dot.idle{background:#3a3e47}
  .doc .t{font-size:12.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc .m{font-family:var(--mono);font-size:10.5px;color:var(--fg-faint);margin-top:1px}

  .rail-foot{border-top:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:8px}
  .avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(140deg,#3a3e47,#20232a);
          display:grid;place-items:center;font-size:10px;color:var(--fg-dim);border:1px solid var(--line-2)}
  .rail-foot .u{font-size:12px;color:var(--fg-dim)}
  .rail-foot .s{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--fg-faint)}

  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{height:46px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px}
  .crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-faint)}
  .crumb b{color:var(--fg);font-weight:500}
  .crumb .sep{opacity:.5}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}

  .btn{height:28px;padding:0 11px;border-radius:var(--radius);border:1px solid var(--line-2);
       background:transparent;color:var(--fg-dim);font:inherit;font-size:12.5px;cursor:pointer;
       display:inline-flex;align-items:center;gap:6px;transition:background .12s,color .12s,border-color .12s}
  .btn:hover{background:var(--panel-2);color:var(--fg);border-color:#34383f}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .btn.primary:hover{background:#7c88f5;border-color:#7c88f5}
  .btn.ghost{border-color:transparent}
  .btn svg{width:13px;height:13px}

  .dochead{flex:none;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .dochead .row{display:flex;align-items:center;gap:10px}
  .title-input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;
               font-size:17px;font-weight:600;letter-spacing:-.015em;padding:2px 0;outline:none}
  .badge{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim);border:1px solid var(--line-2);
         border-radius:4px;padding:1px 6px;white-space:nowrap}
  .badge.live{color:var(--accent);border-color:rgba(110,123,242,.35);background:var(--accent-soft)}

  .tabs{display:flex;gap:2px;margin-top:12px}
  .tab{height:26px;padding:0 9px;border-radius:5px;font-size:12.5px;color:var(--fg-faint);cursor:pointer;
       display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}
  .tab:hover{color:var(--fg-dim);background:var(--panel-2)}
  .tab.on{color:var(--fg);background:var(--panel-3);border-color:var(--line-2)}
  .tab .n{font-family:var(--mono);font-size:10px;color:var(--fg-faint)}

  .work{flex:1;display:grid;grid-template-columns:1fr 232px;min-height:0}
  .canvas{position:relative;overflow:hidden;background:#0c0d0f;
          background-image:radial-gradient(circle, #23252b 1px, transparent 1px);
          background-size:24px 24px;background-position:-1px -1px}
  .canvas::after{content:"";position:absolute;inset:0;pointer-events:none;
          background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.45) 100%)}
  .hud{position:absolute;left:14px;top:14px;display:flex;gap:6px;z-index:2}
  .chip{height:26px;padding:0 9px;border-radius:var(--radius);background:rgba(16,17,19,.9);
        border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:6px;
        font-family:var(--mono);font-size:11px;color:var(--fg-dim);backdrop-filter:blur(8px)}
  .chip b{color:var(--fg);font-weight:500}
  .zoomer{position:absolute;right:14px;bottom:14px;display:flex;z-index:2;border:1px solid var(--line-2);
          border-radius:var(--radius);overflow:hidden;background:rgba(16,17,19,.9)}
  .zoomer button{width:26px;height:26px;background:transparent;border:0;color:var(--fg-dim);cursor:pointer;font-size:13px}
  .zoomer button:hover{background:var(--panel-3);color:var(--fg)}
  .zoomer .lvl{width:44px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--fg-dim);
               border-left:1px solid var(--line-2);border-right:1px solid var(--line-2)}
  svg.flow{position:absolute;inset:0;width:100%;height:100%}
  svg.flow path[marker-end]{fill:none}

  .inspector{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:auto}
  .insp-sec{padding:13px 12px;border-bottom:1px solid var(--line)}
  .insp-sec h4{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-faint);
               font-weight:500;margin-bottom:9px;display:flex;align-items:center}
  .insp-sec h4 span{margin-left:auto;font-family:var(--mono);letter-spacing:0;font-size:10px;color:#4a505b}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tile{aspect-ratio:1/.86;border-radius:var(--radius);border:1px solid var(--line-2);background:var(--panel-2);
        display:grid;place-items:center;cursor:grab;transition:border-color .12s,background .12s}
  .tile:hover{border-color:#3d424b;background:var(--panel-3)}
  .tile.on{border-color:var(--accent);background:var(--accent-soft)}
  .tile svg{width:26px;height:26px}
  .stack{display:flex;gap:4px;flex-wrap:wrap}
  .sw{width:20px;height:20px;border-radius:4px;border:1px solid rgba(255,255,255,.14);cursor:pointer}
  .sw.on{box-shadow:0 0 0 1px var(--accent),0 0 0 3px rgba(110,123,242,.2)}
  .krow{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:12px;color:var(--fg-dim)}
  .krow .v{font-family:var(--mono);font-size:11px;color:var(--fg)}
  .slider{height:3px;border-radius:2px;background:var(--panel-3);margin:8px 0 10px;position:relative}
  .slider i{position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--accent);border-radius:2px}
  .slider b{position:absolute;left:38%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
            background:#fff;border:1px solid #0a0b0d}
  .statusbar{flex:none;height:26px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;
             padding:0 14px;font-family:var(--mono);font-size:10.5px;color:var(--fg-faint);background:var(--panel)}
  .statusbar .ok{color:#5cba8a}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark">P</div>
      <b>Process</b>
      <span>v2.4</span>
    </div>

    <nav class="nav">
      <div class="nav-item is-active"><span class="ico">▤</span>全部文件<span class="kbd">⌘1</span></div>
      <div class="nav-item"><span class="ico">◇</span>模板<span class="kbd">⌘2</span></div>
      <div class="nav-item"><span class="ico">✕</span>回收站</div>
    </nav>

    <div class="rail-sec">最近</div>
    <div class="doclist">
      <div class="doc is-active"><i class="dot"></i><div><div class="t">未命名流程图</div><div class="m">刚刚 · 本地草稿</div></div></div>
      <div class="doc"><i class="dot idle"></i><div><div class="t">支付链路梳理</div><div class="m">2 小时前 · 已保存</div></div></div>
      <div class="doc"><i class="dot idle"></i><div><div class="t">Q3 规划脑图</div><div class="m">昨天 · 已保存</div></div></div>
      <div class="doc"><i class="dot idle"></i><div><div class="t">接口设计说明</div><div class="m">3 天前 · Markdown</div></div></div>
    </div>

    <div class="rail-foot">
      <div class="avatar">L</div>
      <div class="u">Local Demo</div>
      <div class="s">⌥,</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb">文件<span class="sep">/</span><b>未命名流程图</b></div>
      <div class="top-actions">
        <button class="btn ghost">导出</button>
        <button class="btn">分享</button>
        <button class="btn primary">保存</button>
      </div>
    </header>

    <div class="dochead">
      <div class="row">
        <input class="title-input" value="未命名流程图" />
        <span class="badge live">LOCAL DRAFT</span>
        <span class="badge">流程图</span>
      </div>
      <div class="tabs">
        <div class="tab on">流程图</div>
        <div class="tab">思维导图</div>
        <div class="tab">Markdown</div>
        <div class="tab">思维笔记</div>
      </div>
    </div>

    <div class="work">
      <div class="canvas">
        <div class="hud">
          <div class="chip">节点 <b>5</b></div>
          <div class="chip">连线 <b>4</b></div>
          <div class="chip" style="color:#5cba8a">● 已同步</div>
        </div>

        <svg class="flow" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0.5 L9,5 L0,9.5 z" fill="#3f444d"/>
            </marker>
            <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0.5 L9,5 L0,9.5 z" fill="#6e7bf2"/>
            </marker>
          </defs>

          <path d="M180 238 H248" stroke="#3f444d" stroke-width="1.5" marker-end="url(#arrow)"/>
          <path d="M392 238 H462" stroke="#6e7bf2" stroke-width="1.5" marker-end="url(#arrow-a)"/>
          <path d="M540 238 H560 Q572 238 572 226 V160 Q572 148 584 148 H618" stroke="#3f444d" stroke-width="1.5" marker-end="url(#arrow)"/>
          <path d="M540 238 H560 Q572 238 572 250 V316 Q572 328 584 328 H618" stroke="#3f444d" stroke-width="1.5" marker-end="url(#arrow)"/>

          <g>
            <rect x="60" y="210" width="120" height="56" rx="6" fill="#15161a" stroke="#2a2d34"/>
            <text x="120" y="243" text-anchor="middle" fill="#e8e9ed" font-size="13" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif">开始</text>
          </g>
          <g>
            <rect x="248" y="210" width="144" height="56" rx="6" fill="#15161a" stroke="#2a2d34"/>
            <text x="320" y="243" text-anchor="middle" fill="#e8e9ed" font-size="13" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif">需求评审</text>
          </g>
          <g>
            <path d="M462 238 L540 200 L618 238 L540 276 Z" fill="#15161a" stroke="#6e7bf2" stroke-width="1.5"/>
            <text x="540" y="243" text-anchor="middle" fill="#c9ccd3" font-size="12" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif">通过？</text>
          </g>
          <g>
            <rect x="618" y="120" width="140" height="56" rx="6" fill="#15161a" stroke="#2a2d34"/>
            <text x="688" y="153" text-anchor="middle" fill="#e8e9ed" font-size="13" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif">开发实现</text>
          </g>
          <g>
            <rect x="618" y="300" width="140" height="56" rx="6" fill="#15161a" stroke="#2a2d34"/>
            <text x="688" y="333" text-anchor="middle" fill="#e8e9ed" font-size="13" font-family="-apple-system,'Segoe UI','PingFang SC',sans-serif">退回修改</text>
          </g>

          <text x="420" y="228" fill="#6e7bf2" font-size="11" font-family="ui-monospace,Consolas,monospace">是</text>
          <text x="580" y="196" fill="#666c78" font-size="11" font-family="ui-monospace,Consolas,monospace">是</text>
          <text x="580" y="292" fill="#666c78" font-size="11" font-family="ui-monospace,Consolas,monospace">否</text>

          <rect x="248" y="210" width="144" height="56" rx="6" fill="none" stroke="rgba(110,123,242,.35)" stroke-width="4" opacity=".5"/>
        </svg>

        <div class="zoomer">
          <button>−</button><div class="lvl">100%</div><button>+</button>
        </div>
      </div>

      <aside class="inspector">
        <div class="insp-sec">
          <h4>图形 <span>06</span></h4>
          <div class="grid3">
            <div class="tile on"><svg viewBox="0 0 24 24" fill="none" stroke="#c9ccd3" stroke-width="1.4"><rect x="4" y="7" width="16" height="10" rx="2"/></svg></div>
            <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="#8b909b" stroke-width="1.4"><path d="M12 4l8 8-8 8-8-8z"/></svg></div>
            <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="#8b909b" stroke-width="1.4"><ellipse cx="12" cy="12" rx="8" ry="5.5"/></svg></div>
            <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="#8b909b" stroke-width="1.4"><path d="M4 12h5l3-5 3 10 3-5h2"/></svg></div>
            <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="#8b909b" stroke-width="1.4"><rect x="4" y="6" width="16" height="12"/></svg></div>
            <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="#8b909b" stroke-width="1.4"><path d="M4 8h10a3 3 0 010 6H9l-5 5z"/></svg></div>
          </div>
        </div>

        <div class="insp-sec">
          <h4>填充</h4>
          <div class="stack">
            <div class="sw on" style="background:#1a1c21"></div>
            <div class="sw" style="background:#20232a"></div>
            <div class="sw" style="background:#2b2530"></div>
            <div class="sw" style="background:#1b2a26"></div>
            <div class="sw" style="background:#25232e"></div>
            <div class="sw" style="background:#ffffff"></div>
          </div>
        </div>

        <div class="insp-sec">
          <h4>描边</h4>
          <div class="stack">
            <div class="sw on" style="background:#6e7bf2"></div>
            <div class="sw" style="background:#3f444d"></div>
            <div class="sw" style="background:#c9ccd3"></div>
            <div class="sw" style="background:#2a2d34"></div>
          </div>
          <div class="slider"><i></i><b></b></div>
          <div class="krow"><span>宽度</span><span class="v">1.5 px</span></div>
          <div class="krow"><span>圆角</span><span class="v">6 px</span></div>
        </div>

        <div class="insp-sec" style="border-bottom:0">
          <h4>布局</h4>
          <div class="krow"><span>对齐</span><span class="v">自动</span></div>
          <div class="krow"><span>吸附网格</span><span class="v">24 px</span></div>
          <div class="krow"><span>节点</span><span class="v">5</span></div>
        </div>
      </aside>
    </div>

    <div class="statusbar">
      <span class="ok">●</span><span>自动保存已开启</span>
      <span style="margin-left:auto">x 320 &nbsp; y 244</span>
      <span>100%</span>
    </div>
  </div>
</div>
</body>
</html>
